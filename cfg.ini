; ============================================================================
; GodGame 参数表
;
; 单位统一：时间一律用「秒」，速度用「像素/秒」，距离用「像素」，比例用 0~1。
; 旧版逻辑跑在 QTimer(16ms) 上（约 62.5 tick/秒），所以旧代码里那些按帧写的数值
; 都换算过了 —— 注释里给出旧值，方便对着旧代码核对。
;
; 缺项不要紧：少一节、少一行、甚至整个文件读不到，都会退回代码里的默认值
; （见 include/utils/simpleIni/config.h），不会有未初始化的参数。
; ============================================================================

[Game]
; 逻辑 TPS。世界按这个频率推进，与渲染帧率解耦
TickRate=20
; 渲染帧率（只影响画面刷新，不影响物理）
FrameRate=100
WorldWidth=1400
WorldHeight=1000
; 白条上那笔账无论多大都在这个秒数内结完（玩家与 BOSS 共用）。
; 调大 = 挨打后"将死未死"的窗口更长
WhiteShieldMaxSettle=1.5
; 旧键，等价于 [Player] Hp
PlayerDefaultHp=100

[Player]
Hp=100
; 旧 baseSpeed=2 像素/帧
Speed=125
; 旧 sprintSpeed=10 像素/帧
SprintSpeed=625
Width=35
Height=35
Ammo=60
MaxAmmo=360
; 旧 shootInterval=8 帧
FireInterval=0.128
; 旧 invincibleDuration=120 帧
InvincibleTime=1.92
; 白条：挨打后伤害先记在账上（画成血条顶端那一截白条），延迟 WhiteShieldDelay 秒之后
; 按每秒 WhiteShieldRate 点转成真血。伤害一点没少，只是晚到账 —— 换来一小段反应时间。
; WhiteShield=0 就退回旧版那种"挨打立刻掉血"
WhiteShield=1
WhiteShieldDelay=0.6
; 每秒转多少点成真血。100 点血 → 一秒结清；调小就是慢慢失血
WhiteShieldRate=100
; 体力：旧 staminaDrain=0.8/帧、staminaRegen=0.4/帧
StaminaMax=100
StaminaDrain=50
StaminaRegen=25
; 力竭后体力回到 maxStamina*该比例才能再冲刺（旧版硬编码 0.15，也就是 15 点）
StaminaRecoverRatio=0.15
; 升级曲线：旧版是等差，每级所需经验 +50
ExpBase=100
ExpStep=50
AmmoPerLevel=20
; 每次升级回血比例（1.0 = 回满）
HealOnLevelUp=1.0
MaxLevel=100
; 每 5 级额外加一档体力/弹匣上限（旧 level%5==0）
BonusEveryLevels=5
BonusMaxStamina=5
; 旧 +0.05/帧、+0.02/帧
BonusStaminaRegen=3.125
BonusStaminaDrain=1.25
BonusMaxAmmo=20
; 旧 levelUpTimer=120 帧
LevelUpFlashTime=1.92

[Bullet]
; 旧 bulletspeed=10 像素/帧
Speed=625
; 普通敌人 10 血，一枪一个（旧版就是一枪死）
Damage=10
; 旧 8x8 的子弹
Radius=4
Life=3.0

[Enemy]
Hp=10
; 旧 speed = 1 + rand()%4，即 1~4 像素/帧
SpeedMin=62.5
SpeedMax=250
Width=35
Height=35
; 撞到玩家扣的血
ContactDamage=20
; 旧 rand()%100 < 10
DashChance=0.10
; 冲刺型不是加速，是每隔一段时间沿玩家方向瞬移一段（旧 dashTimer=300 帧）
BlinkInterval=4.8
BlinkDistance=350
BlinkMinDistance=400
; 波次：第 round 回合共 round*150 只，场上不足 15 只就补刷
AtLeast=15
PerRound=150
; 出场节奏：旧 3 + 19/(1+exp(round-6)/1.5) 帧，除以 62.5 得秒
SpawnBase=0.048
SpawnAmp=0.304
SpawnCenter=6.0
SpawnK=1.5
SpawnMin=0.048
; 旧 300 帧
RoundWaitTime=4.8
; 旧版不随难度成长，留着给以后调
HpGrowth=0.0
SpeedGrowth=0.0
DeathScore=1
DeathExp=10

[Boss]
; 旧版每回合末都出 Boss（不是按分数或时间触发）
EveryRounds=1
; 旧 bossMaxHp 从 30 起、每回合 +10，且 1 血 = 1 发 → 这里乘 10
HpBase=300
HpGrowth=100
; 旧 2 像素/帧
Speed=125
Width=100
Height=100
ContactDamage=60
; 旧 bossWarnTime=600 帧（场上剩 50 只时开始闪）
WarnTime=9.6
; 半血时无敌 4.8 秒并召唤 10 个帮手（旧 speed=5 像素/帧）
SummonCount=10
SummonSpeed=312.5
SummonSpread=120
Phase2Ratio=0.5
; 旧 bossInvincibleTimer=300 帧
InvincibleTime=4.8
; 白条：挨打时先把伤害记在账上，冻结 WhiteFreezeTime 秒后按每秒
; max(最大血量*WhiteDropRatio, WhiteDropMin) 点转成真血。
; WhiteShield=0 就退回旧版那种纯视觉延迟（真血立刻掉、白条慢慢追）
WhiteShield=1
WhiteDropRatio=0.625
WhiteDropMin=31.25
; 旧 bossWhiteDelay=30 帧：刚挨打时白条冻结
WhiteFreezeTime=0.48
DeathScore=50
DeathExp=300

[Pickup]
; 代码实测掉落率（旧图鉴写 15%/10%，与代码不符，这里按代码）
AmmoChance=0.09
AmmoMin=20
AmmoMax=35
HealthChance=0.04
HealthAmount=10
; 旧 lifeTimer=1200 帧
Lifetime=19.2
Size=24

[Console]
MaxHistory=8
; crazyyy → 旧 invincibleTimer=12000 帧
InvincibleTime=192.0
